name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $bin = (Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1).Directory.FullName
          "FFMPEG_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build
        run: cargo build --release

      - name: Test
        shell: pwsh
        env:
          DOTFILM_REQUIRE_GPU: "1"
        run: |
          cargo test --release -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          # Report the GPU in use and any failure as annotations (readable through the GitHub API).
          $gpu = Select-String -Path test.log -Pattern "adapter:" | Select-Object -First 1
          if ($gpu) { Write-Output "::notice title=GPU::$($gpu.Line)" }
          $diag = (Select-String -Path test.log -Pattern "DIAG" | ForEach-Object { $_.Line }) -join "%0A"
          if ($diag) { Write-Output "::notice title=Color pipeline::$diag" }
          if ($code -ne 0) {
            $tail = (Get-Content test.log | Select-Object -Last 60) -join "%0A"
            Write-Output "::error title=Tests failed::$tail"
            exit $code
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/dotfilm.exe dist/
          Copy-Item "$env:FFMPEG_BIN/ffmpeg.exe" dist/
          Copy-Item "$env:FFMPEG_BIN/ffprobe.exe" dist/
          Copy-Item README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dotfilm-windows
          path: dist/
