[package]
name = "dotfilm"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37"                 # window + UI (egui), GPU rendering via wgpu
egui = "0.37"
cpal = "0.18"                   # audio output
rfd = "0.17"                    # native open/save dialogs
crossbeam-channel = "0.5"       # thread communication
serde = { version = "1", features = ["derive"] }
serde_json = "1"                # project files
bytemuck = { version = "1", features = ["derive"] }  # GPU uniform structs
pollster = "0.4"              # wait for GPU setup on export threads
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }

# Debug builds: optimize dependencies so playback is usable while developing.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
